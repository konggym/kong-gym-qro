:root{
  --bg:#070f22; --bg2:#0c1834; --card:#102043; --card2:#162a55; --line:rgba(255,196,110,.11);
  --text:#fbf1de; --muted:#9eaed0; --leaf:#ffb22e; --leaf2:#d9841a; --gold:#ffd27a; --danger:#ff7a5c;
  --ink:#0a1428; --glow:rgba(255,170,40,.55); --glow-soft:rgba(255,170,40,.18);
  --display:'Luckiest Guy',system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;
  background:
    radial-gradient(700px 380px at 50% -120px, rgba(255,170,40,.22), transparent 70%),
    radial-gradient(600px 500px at 110% 60%, rgba(40,80,170,.28), transparent 70%),
    radial-gradient(500px 400px at -20% 100%, rgba(255,150,30,.10), transparent 70%),
    var(--bg);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--leaf)}
#app{max-width:520px;margin:0 auto;padding:0 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
main{padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--leaf2);display:grid;place-items:center;font-size:24px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bt{font-family:var(--display);font-size:21px;letter-spacing:.06em;line-height:1}
.bs{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-shadow:0 0 28px var(--glow-soft)}
h1{font-size:28px;line-height:1.12}
h2{font-size:21px;margin:24px 0 10px}
h3{font-size:18px;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:radial-gradient(130% 70% at 50% -30%,rgba(255,178,46,.10),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 45%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,214,140,.08),0 20px 40px -26px var(--glow),0 2px 0 rgba(0,0,0,.25)}
.hero{position:relative;overflow:hidden;background:radial-gradient(90% 75% at 88% -5%,rgba(255,178,46,.38),transparent 62%),radial-gradient(60% 60% at 0% 110%,rgba(255,140,20,.12),transparent 70%),linear-gradient(165deg,#18306a,#0c1834 70%);padding:20px;border-color:rgba(255,196,110,.22);box-shadow:inset 0 1px 0 rgba(255,214,140,.18),0 26px 50px -24px var(--glow)}
.hero .leafbg{position:absolute;right:-30px;top:-30px;opacity:.16;width:190px;pointer-events:none}
.stage-ico{font-size:54px;line-height:1}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.bar{height:9px;border-radius:9px;background:rgba(0,0,0,.28);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--leaf2),var(--leaf));box-shadow:0 0 12px var(--glow)}
.bar.done>i{background:linear-gradient(90deg,var(--leaf),var(--gold));box-shadow:0 0 16px rgba(255,210,122,.7)}
.crit{margin-top:14px}
.crit-row{display:flex;justify-content:space-between;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:radial-gradient(120% 80% at 50% -40%,rgba(255,178,46,.12),transparent 65%),var(--card);box-shadow:inset 0 1px 0 rgba(255,214,140,.07);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--gold);text-shadow:0 0 18px var(--glow-soft);font-weight:400;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);font-size:16px;box-shadow:inset 0 1px 0 rgba(255,240,200,.6),0 12px 30px -10px var(--glow),0 0 0 1px rgba(255,200,110,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,178,46,.04);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#ffe1a0,var(--gold))}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,122,92,.4);box-shadow:none}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.pill{padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px}
.pill.on{background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);border-color:var(--leaf);font-weight:700;box-shadow:0 6px 18px -6px var(--glow)}
.pill .sug{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:4px}
.pill.on .sug{color:var(--ink)}
.ex{background:radial-gradient(120% 60% at 0% -20%,rgba(255,178,46,.08),transparent 60%),var(--card);box-shadow:inset 0 1px 0 rgba(255,214,140,.06),0 14px 30px -24px var(--glow);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-n{font-weight:700;font-size:16px}
.ex-p{font-family:var(--display);font-size:16px;text-shadow:0 0 14px var(--glow-soft);color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:rgba(255,178,46,.14);color:var(--gold);margin-left:6px;vertical-align:2px}
.tip{font-size:13px;color:var(--muted);margin-top:6px}
.last{font-size:12px;color:var(--leaf);margin-top:6px}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
.set .no{font-size:13px;color:var(--muted);text-align:center}
.set input{padding:9px 10px;text-align:center}
.chk{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:transparent;background:var(--bg2)}
.chk.on{background:var(--leaf);color:var(--ink);border-color:var(--leaf);box-shadow:0 0 14px var(--glow)}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.sticky-finish{position:fixed;left:0;right:0;bottom:78px;padding:0 16px;z-index:6}
.sticky-finish .btn{max-width:488px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(7,15,34,.94);box-shadow:0 -14px 30px -20px var(--glow);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tab .ti{font-size:20px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--leaf);text-shadow:0 0 12px var(--glow)}
.tab.on .ti{filter:drop-shadow(0 0 8px var(--glow));opacity:1}
.stage-list .card{display:flex;gap:14px;align-items:flex-start}
.stage-list .card.cur{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf) inset,0 0 30px -6px var(--glow)}
.stage-list .card.lock{opacity:.6}
.stage-list .si{font-size:38px;line-height:1}
.req{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.req span{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.req span.ok{border-color:rgba(255,178,46,.5);color:var(--leaf)}
.lift{display:flex;justify-content:space-between;align-items:baseline}
.lift b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);text-shadow:0 0 18px var(--glow-soft)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.x{width:34px;height:34px;border-radius:10px;color:var(--muted);border:1px solid var(--line)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.seg button.on{background:var(--leaf);color:var(--ink);font-weight:700;border-color:var(--leaf)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal.hidden{display:none}
.sheet{background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:488px;max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--ink);box-shadow:0 10px 30px -8px var(--glow);font-weight:700;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
.onb{padding-top:30px}
.onb .big{font-size:64px}
.center{text-align:center}
.note{font-size:13px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:18px 0}

.logo{background:radial-gradient(circle at 50% 35%,#1d3670,#0c1834);box-shadow:0 0 0 1px rgba(255,178,46,.55),0 0 26px rgba(255,170,40,.45),inset 0 1px 0 rgba(255,214,140,.25);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.top{box-shadow:0 14px 30px -22px var(--glow)}
.bt{color:var(--gold);text-shadow:0 0 18px var(--glow)}
.stage-ico,.stage-list .card.cur .si{filter:drop-shadow(0 0 16px rgba(255,170,40,.55))}
.eyebrow{text-shadow:0 0 14px var(--glow-soft)}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(255,178,46,.15),0 0 18px -4px var(--glow)}
.sheet{background:radial-gradient(110% 60% at 50% -10%,rgba(255,178,46,.16),transparent 60%),var(--card2);box-shadow:0 -10px 50px -10px var(--glow)}
.note{background:rgba(12,24,52,.7)}

.logo-hero{position:relative;max-width:340px;margin:0 auto}
.logo-hero::before{content:"";position:absolute;inset:8% 10%;background:radial-gradient(closest-side,rgba(255,170,40,.45),transparent);filter:blur(28px);z-index:0}
.logo-hero img{position:relative;z-index:1;width:100%;display:block;
  -webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.onb{padding-top:6px}

/* ===== Optimización móvil ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
*{-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,label{touch-action:manipulation}
input,select,textarea{font-size:16px}          /* evita el zoom automático de iOS */
button{user-select:none;-webkit-user-select:none}
.logo{width:48px;height:48px;padding:0;flex:none;border-radius:13px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.top{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:10px}
h1{font-size:clamp(23px,7vw,28px)}
.chk{width:46px;height:46px}
.set,.sethead{grid-template-columns:26px 1fr 1fr 46px}
.set input{padding:11px 8px;min-height:46px}
.x{width:42px;height:42px}
.pill{padding:11px 15px;min-height:44px}
.pills{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;margin-right:-16px;padding-right:16px}
.pill{scroll-snap-align:start}
.tab{min-height:48px;justify-content:center}
.btn{min-height:52px}
.sticky-finish{bottom:calc(76px + env(safe-area-inset-bottom))}
#app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);font-size:14px}
.toast.show{transform:translateX(-50%)}
@media (max-width:360px){
  #app{padding-left:12px;padding-right:12px}
  .top{margin:0 -12px;padding-left:12px;padding-right:12px}
  .bt{font-size:18px}.bs{font-size:11px}
  .chip{font-size:12px;padding:5px 9px}
  .stats{gap:7px}.stat{padding:10px 6px}.stat b{font-size:20px}.stat span{font-size:11px}
  .card,.ex{padding:14px}
  .row{flex-direction:column;gap:0}
  .tab{font-size:10px}
  .pills{margin-right:-12px;padding-right:12px}
  .stage-ico{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.seg.mode{margin-bottom:16px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg.mode button{border:0;background:transparent;min-height:44px;font-weight:700;color:var(--muted)}
.seg.mode button.on{background:linear-gradient(180deg,#ffc552,#f59e1c);color:var(--ink);box-shadow:0 6px 18px -8px var(--glow)}
.coach-note{font-size:13px;color:var(--gold);margin-top:6px;background:rgba(255,178,46,.08);border-radius:8px;padding:6px 9px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;min-height:56px}
.switch{width:50px;height:30px;border-radius:30px;background:var(--bg2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--leaf);border-color:var(--leaf);box-shadow:0 0 14px var(--glow)}
.switch.on i{left:23px;background:var(--ink)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;min-height:72px;justify-content:center}
.act span{font-size:20px}.act small{font-weight:400;font-size:11px;color:var(--muted)}
.day-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dnum{width:30px;height:30px;border-radius:9px;background:var(--leaf);color:var(--ink);display:grid;place-items:center;font-family:var(--display);flex:none;box-shadow:0 0 12px var(--glow)}
.day-name{font-weight:700;padding:9px 10px;min-width:0;flex:1}
.ib{width:40px;height:40px;flex:none;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:16px;display:grid;place-items:center}
.ib:disabled{opacity:.3}
.ib.red{color:var(--danger)}
.ex-ed{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px}
.ex-ed-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-ctrl{display:flex;gap:4px}
.ex-ctrl .ib{width:36px;height:36px;font-size:14px}
.ex-ed-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:42px;font-size:20px;color:var(--leaf)}
.stepper b small{display:block;font-family:'DM Sans',sans-serif;font-size:10px;color:var(--muted);line-height:1;margin-top:1px}
.stepper b{min-width:44px;line-height:1;text-align:center;font-family:var(--display);font-size:18px;font-weight:400;color:var(--gold)}
.reps-in{width:84px;text-align:center;padding:10px 6px;font-weight:700}
.ex-note{margin-top:8px;padding:9px 10px;font-size:16px}
.btn.sm{min-height:46px;padding:10px;font-size:15px;margin-top:4px}
.btn.ghost.solid{background:var(--bg2)}
.row.two{gap:10px}.row.two .btn{margin-top:0}.row.two .btn:first-child{flex:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick-list{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg2);-webkit-overflow-scrolling:touch}
.pick-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);min-height:50px;gap:10px}
.pick-item:last-child{border-bottom:0}
.pick-item .add{color:var(--leaf);font-size:20px;font-weight:700}
.pick-item .in{color:var(--muted);font-size:12px;white-space:nowrap}
.pick-item.new{color:var(--gold);font-weight:700}
.sheet{max-height:90vh}
@media (max-width:360px){.row.two{flex-direction:row;gap:8px}.reps-in{width:66px}.stepper button{width:36px}.stepper b{min-width:38px}.ex-ed-row{gap:6px}.actions{grid-template-columns:repeat(2,1fr)}.ex-ctrl .ib{width:34px;height:34px}}
</style>
</head>

function ageFrom(birth){

function rkForLevel(levelKey){ return levelKey; }

const SENIOR_SWAP={dominadas:'jalon',fondos:'triceps',militar:'hombroMan',bulgara:'zancadas',remoBarra:'remoPolea'};
function adjReps(reps,min){ if(/s$/.test(reps)) return reps; const lo=parseInt(reps,10); return lo<min ? min+'-'+(min+2) : reps; }
/* Devuelve la rutina ajustada a la edad del socio */
function getRoutine(rk){
  const r=R[rk], g=ageGroup();
  const days=r.days.map(d=>{
    const seen=new Set(), ex=[];
    d.ex.forEach(([id,sets,reps])=>{
      let nid=id, ns=sets, nr=reps;
      if(g==='senior'){ nid=SENIOR_SWAP[id]||id; nr=adjReps(reps,8); ns=Math.min(sets,3); }
      else if(g==='joven'){ nr=adjReps(reps,8); ns=Math.min(sets,3); }
      else if(g==='maduro'){ nr=adjReps(reps,6); }
      if(seen.has(nid)) return; seen.add(nid); ex.push([nid,ns,nr]);
    });
    if(g==='senior') ex.push(['equilibrio',2,'30 s']);
    return {k:d.k,n:d.n,ex};
  });
  return {...r,days};
}

function e1rm(w,r){ w=num(w); r=num(r); if(!w||!r) return 0; if(r>12) r=12; return r===1 ? w : w*(1+r/30); }
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }

/* ===================== MÉTRICAS ===================== */
function bestLifts(sessions){
  const best={sentadilla:0,banca:0,muerto:0};
  (sessions||S.sessions).forEach(s=>(s.sets||[]).forEach(st=>{
    if(best[st.ex]!==undefined){ const v=e1rm(st.w,st.r); if(v>best[st.ex]) best[st.ex]=v; }
  }));
  return best;
}
function trainingDays(sessions){ return new Set((sessions||S.sessions).map(s=>ymd(new Date(s.date)))).size; }
function monthsIn(){
  if(!S.profile||!S.profile.start) return 0;
  const d=(Date.now()-new Date(S.profile.start+'T00:00:00').getTime())/86400000;
  return Math.max(0,d/30.44);
}
function sexFactor(){ return S.profile && S.profile.sex==='m' ? 0.7 : 1; }
function strengthFactor(){ return sexFactor()*AGE[ageGroup()].f; }
function metrics(sessions){
  const b=bestLifts(sessions);
  const bw=num(S.profile&&S.profile.weight);
  const total=b.sentadilla+b.banca+b.muerto;
  return { months:monthsIn(), days:trainingDays(sessions), ratio: bw? total/bw : 0, total, best:b };
}
function meets(st,m){ const f=strengthFactor(); return m.months>=st.m && m.days>=st.s && m.ratio+1e-9>=st.f*f; }
function stageIdx(m){ let i=0; for(let j=1;j<STAGES.length;j++){ if(meets(STAGES[j],m)) i=j; else break; } return i; }
function streakWeeks(){
  const weeks=new Set(S.sessions.map(s=>ymd(weekStart(new Date(s.date)))));
  let w=weekStart(new Date()); let n=0;
  if(!weeks.has(ymd(w))) w.setDate(w.getDate()-7);
  while(weeks.has(ymd(w))){ n++; w.setDate(w.getDate()-7); }
  return n;
}
function daysThisWeek(){
  const ws=weekStart(new Date()).getTime();
  return new Set(S.sessions.filter(s=>new Date(s.date).getTime()>=ws).map(s=>ymd(new Date(s.date)))).size;
}
function lastSetsFor(ex){
  for(let i=S.sessions.length-1;i>=0;i--){
    const sets=(S.sessions[i].sets||[]).filter(s=>s.ex===ex);
    if(sets.length) return sets;
  }
  return null;
}
function suggestedDay(rk){
  const r=routineByRk(rk);
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.rk===rk && s.day){ const idx=r.days.findIndex(d=>d.k===s.day); if(idx>=0) return r.days[(idx+1)%r.days.length].k; }
  }
  return r.days[0].k;
}

const TIME_EX = {plancha:'Seg',equilibrio:'Seg',cardio:'Min'};
function exInfo(id){ return EX[id] || {n:(S.exNames&&S.exNames[id]) || 'Ejercicio', t:''}; }
function hasCustom(){ return !!(S.custom && S.custom.days && S.custom.days.some(d=>d.ex.length)); }
function customRoutine(){
  const c=S.custom;
  return {n:c.name, level:'custom', freq:c.days.length, focus:c.note||'', coach:c.coach||'',
    days:c.days.filter(d=>d.ex.length).map(d=>({k:d.k,n:d.n,ex:d.ex.map(x=>[x.id,x.sets,x.reps,x.note||''])}))};
}
function routineByRk(rk){ return rk==='custom' ? customRoutine() : getRoutine(rk); }
function levelRk(){ return rkForLevel(LEVELS[levelIdx(monthsIn())].k); }
function newKey(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function exCard(id,sets,reps,note){
  const e=exInfo(id); const last=lastSetsFor(id);

function startDraft(rk, day){

}
function shareModal(){
  const code=encodeRoutine();

  openModal(`<h3>Compartir rutina</h3>

function parseRoutineCode(txt){
  const m=String(txt).match(/KONGR1:([A-Za-z0-9+/=]+)/); if(!m) throw 0;
  const data=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  if(!data.c||!Array.isArray(data.c.days)) throw 0;
  return data;
}
function importModal(){
  openModal(`<h3>Pegar rutina de tu instructor</h3>
    <p class="muted small" style="margin:6px 0 12px">Pega aquí el mensaje o código que te mandó tu instructor.</p>

  $('#imIn').oninput=prev;
  $('#imNo').onclick=closeModal;
  $('#imOk').onclick=()=>{
    try{

function openEditor(src){

  ui.editing=true; render(); window.scrollTo(0,0);
}
function kongBaseDays(){
  return getRoutine(levelRk()).days.map(d=>({k:newKey(),n:d.n,ex:d.ex.map(([id,sets,reps])=>({id,sets,reps,note:''}))}));
}
function renderEditor(view){
  const e=ui.edit;
  view.innerHTML=`
    <div class="eyebrow">🧑‍🏫 Modo instructor</div>
    <h1 style="margin:4px 0 12px">${e.days.length?'Editar rutina':'Nueva rutina'}</h1>

      <label class="f"><span>Instructor</span><input data-bind="coach" value="${esc(e.coach)}" placeholder="Tu nombre" maxlength="30" autocapitalize="words"></label>
      <label class="f" style="margin:0"><span>Indicaciones generales (opcional)</span><textarea data-bind="note" rows="2" placeholder="Ej. Descanso 90 s. Sube peso cuando completes todas las reps.">${esc(e.note)}</textarea></label>

    ${e.days.length?'':`<div class="card center"><p class="muted small" style="margin-bottom:12px">Empieza con una base y modifícala, o arma la rutina desde cero.</p>
      <button class="btn ghost" data-act="base-kong">Copiar la rutina Kong de su nivel</button>
      <button class="btn ghost" data-act="base-ppl">Días vacíos: Pecho · Espalda · Pierna ×2</button></div>`}
    ${e.days.map((d,di)=>`<div class="card day-ed">
      <div class="day-h"><span class="dnum">${di+1}</span>
        <input class="day-name" data-bind-day="${di}" value="${esc(d.n)}" placeholder="Nombre del día" maxlength="30">
        <button class="ib" data-act="day-up" data-d="${di}" ${di===0?'disabled':''} aria-label="Subir día">↑</button>
        <button class="ib" data-act="day-down" data-d="${di}" ${di===e.days.length-1?'disabled':''} aria-label="Bajar día">↓</button>
        <button class="ib red" data-act="day-del" data-d="${di}" aria-label="Borrar día">✕</button></div>
      ${d.ex.length?d.ex.map((x,xi)=>`<div class="ex-ed">
        <div class="ex-ed-top"><div class="ex-n" style="font-size:15px">${xi+1}. ${esc(exInfo(x.id).n)}</div>
          <div class="ex-ctrl"><button class="ib" data-act="ex-up" data-d="${di}" data-x="${xi}" ${xi===0?'disabled':''} aria-label="Subir">↑</button><button class="ib" data-act="ex-down" data-d="${di}" data-x="${xi}" ${xi===d.ex.length-1?'disabled':''} aria-label="Bajar">↓</button><button class="ib red" data-act="ex-del" data-d="${di}" data-x="${xi}" aria-label="Quitar">✕</button></div></div>
        <div class="ex-ed-row">
          <div class="stepper"><button data-act="sets-minus" data-d="${di}" data-x="${xi}" aria-label="Menos series">−</button><b>${x.sets}<small>series</small></b><button data-act="sets-plus" data-d="${di}" data-x="${xi}" aria-label="Más series">+</button></div>
          <span class="muted">×</span>
          <input class="reps-in" data-bind-ex="reps" data-d="${di}" data-x="${xi}" value="${esc(x.reps)}" placeholder="10-12" maxlength="10">
          <span class="muted small">${TIME_EX[x.id]?TIME_EX[x.id].toLowerCase():'reps'}</span>
        </div>

      </div>`).join(''):`<p class="muted small" style="margin:4px 0 10px">Sin ejercicios todavía.</p>`}
      <button class="btn ghost sm" data-act="ex-add" data-d="${di}">+ Agregar ejercicio</button>
    </div>`).join('')}
    <button class="btn ghost" data-act="day-add">+ Agregar día</button>
    ${e.days.length?`<button class="btn danger" data-act="clear">Vaciar y empezar de nuevo</button>`:''}
    <div style="height:84px"></div>
    <div class="sticky-finish"><div class="row two"><button class="btn ghost solid" data-act="cancel">Cancelar</button><button class="btn" data-act="save">Guardar rutina</button></div></div>`;

  view.oninput=ev=>{
    const t=ev.target;
    if(t.dataset.bind) e[t.dataset.bind]=t.value;
    else if(t.dataset.bindDay!==undefined) e.days[t.dataset.bindDay].n=t.value;
    else if(t.dataset.bindEx) e.days[t.dataset.d].ex[t.dataset.x][t.dataset.bindEx]=t.value;
  };
  view.onclick=ev=>{
    const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
    const a=b.dataset.act, di=+b.dataset.d, xi=+b.dataset.x, y=window.scrollY;
    const day=e.days[di], rer=()=>{ renderEditor(view); window.scrollTo(0,y); };
    const swap=(arr,i,j)=>{ if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; };

    else if(a==='day-up'){ swap(e.days,di,di-1); rer(); }
    else if(a==='day-down'){ swap(e.days,di,di+1); rer(); }
    else if(a==='day-del'){ confirmBox(`¿Borrar el día "${day.n||'sin nombre'}"?`,'Borrar día',()=>{ e.days.splice(di,1); rer(); }); }
    else if(a==='ex-up'){ swap(day.ex,xi,xi-1); rer(); }
    else if(a==='ex-down'){ swap(day.ex,xi,xi+1); rer(); }
    else if(a==='ex-del'){ day.ex.splice(xi,1); rer(); }
    else if(a==='sets-minus'){ day.ex[xi].sets=Math.max(1,day.ex[xi].sets-1); rer(); }
    else if(a==='sets-plus'){ day.ex[xi].sets=Math.min(10,day.ex[xi].sets+1); rer(); }
    else if(a==='ex-add'){ pickerModal(di,()=>rer()); }
    else if(a==='day-add'){ dayAddModal(()=>{ renderEditor(view); window.scrollTo(0,document.body.scrollHeight); }); }
    else if(a==='clear'){ confirmBox('¿Vaciar todos los días?','Vaciar',()=>{ e.days=[]; rer(); }); }
    else if(a==='cancel'){ confirmBox('¿Salir sin guardar los cambios?','Salir sin guardar',()=>{ ui.editing=false; ui.edit=null; render(); }); }
    else if(a==='save'){
      const days=e.days.filter(d=>d.ex.length).map((d,i)=>({k:d.k||newKey(),n:(d.n||'').trim()||('Día '+(i+1)),ex:d.ex.map(x=>({id:x.id,sets:x.sets,reps:String(x.reps||'').trim()||'10',note:(x.note||'').trim()}))}));
      if(!days.length){ toast('Agrega al menos un ejercicio'); return; }
      const dropped=e.days.length-days.length;
      S.custom={name:(e.name||'').trim()||'Rutina personalizada',coach:(e.coach||'').trim(),note:(e.note||'').trim(),days,updated:new Date().toISOString()};
      S.useCustom=true; save(); ui.editing=false; ui.edit=null; ui.mode='custom'; ui.day=null;
      toast(dropped?`Rutina guardada (se quitaron ${dropped} días vacíos)`:'Rutina guardada ✓'); render(); window.scrollTo(0,0);
    }
  };
}

function pickerModal(di,done){
  let grp='all', q='', added=0;
  openModal(`<div class="pick-h"><h3>Agregar a "${esc(ui.edit.days[di].n||'Día')}"</h3><button class="ib" id="pkX" aria-label="Cerrar">✕</button></div>
    <input id="pkQ" placeholder="Buscar ejercicio…" autocomplete="off" style="margin:10px 0">
    <div class="pills" id="pkG" style="margin-bottom:8px"></div>
    <div id="pkL" class="pick-list"></div>
    <button class="btn" id="pkDone" style="margin-top:12px">Listo</button>`);
  const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const draw=()=>{
    $('#pkG').innerHTML=[['all','Todos']].concat(GROUPS.map(g=>[g[0],g[1]])).map(([k,n])=>`<button class="pill ${grp===k?'on':''}" data-g="${k}">${n}</button>`).join('');
    let ids = grp==='all' ? Object.keys(EX) : GROUPS.find(g=>g[0]===grp)[2];
    if(q) ids=ids.filter(id=>norm(EX[id].n).includes(norm(q)));
    const inDay=new Set(ui.edit.days[di].ex.map(x=>x.id));
    $('#pkL').innerHTML = (q?`<button class="pick-item new" data-new="1"><span>＋ Crear ejercicio “${esc(q)}”</span></button>`:'')
      + ids.map(id=>`<button class="pick-item" data-id="${id}"><span>${esc(EX[id].n)}</span><span class="${inDay.has(id)?'in':'add'}">${inDay.has(id)?'✓ agregado':'＋'}</span></button>`).join('')
      + (!ids.length&&!q?'<p class="muted small">Sin ejercicios.</p>':'');
    document.querySelectorAll('#pkG [data-g]').forEach(b=>b.onclick=()=>{ grp=b.dataset.g; draw(); });
    document.querySelectorAll('#pkL [data-id]').forEach(b=>b.onclick=()=>{ addEx(b.dataset.id); });
    const nb=document.querySelector('#pkL [data-new]'); if(nb) nb.onclick=()=>{
      const name=q.trim(); const id='c_'+norm(name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
      S.exNames=S.exNames||{}; S.exNames[id]=name; save(); addEx(id); };
  };
  const addEx=id=>{
    const def=TIME_EX[id]==='Min'?'20':TIME_EX[id]?'30':'10-12';
    ui.edit.days[di].ex.push({id,sets:3,reps:def,note:''}); added++; toast('Agregado: '+exInfo(id).n); draw();
  };
  $('#pkQ').oninput=e=>{ q=e.target.value; draw(); };
  const fin=()=>{ closeModal(); done(); };
  $('#pkDone').onclick=fin; $('#pkX').onclick=fin;
  draw();
}
function renderDraft(view){
  const d=S.draft;
  view.innerHTML=`
    <div class="eyebrow">Entrenamiento en curso</div>
    <h1 style="margin:4px 0 12px">${esc(d.dayName)}</h1>
    ${d.ex.map((x,i)=>{
      const e=exInfo(x.id); const last=lastSetsFor(x.id);
      return `<div class="ex"><div class="ex-h"><div class="ex-n">${esc(e.n)}${e.k?'<span class="tag">Clave</span>':''}</div><div class="ex-p">${x.sets.length}×${esc(x.reps)}</div></div>
      ${x.note?`<div class="coach-note">📝 ${esc(x.note)}</div>`:''}
      ${last?`<div class="last">La vez pasada: ${last.map(s=>(s.w?(+(+s.w).toFixed(1))+'kg':'')+'×'+s.r).join(' · ')}</div>`:''}
      <div class="sets"><div class="sethead"><span>#</span><span>Peso kg</span><span>${TIME_EX[x.id]||'Reps'}</span><span>✓</span></div>
      ${x.sets.map((s,j)=>{
        const ph=last&&last[j]?last[j]:(last?last[last.length-1]:null);
        return `<div class="set"><span class="no">${j+1}</span>
          <input inputmode="decimal" data-i="${i}" data-j="${j}" data-f="w" enterkeyhint="next" autocomplete="off" value="${esc(s.w)}" placeholder="${ph&&ph.w?esc(ph.w):'kg'}">
          <input inputmode="numeric" data-i="${i}" data-j="${j}" data-f="r" enterkeyhint="next" autocomplete="off" value="${esc(s.r)}" placeholder="${ph?esc(ph.r):esc(String(x.reps).split(/[- ]/)[0])}">
          <button class="chk ${s.done?'on':''}" data-i="${i}" data-j="${j}">✓</button></div>`;}).join('')}
      </div></div>`;
    }).join('')}
    <button class="btn ghost" id="cancel" style="margin-top:6px">Descartar entrenamiento</button>
    <div style="height:70px"></div>
    <div class="sticky-finish"><button class="btn" id="finish">Terminar y guardar 🦍</button></div>`;
  view.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{
    const s=d.ex[inp.dataset.i].sets[inp.dataset.j]; s[inp.dataset.f]=inp.value; save();
  });
  view.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{
    const s=d.ex[b.dataset.i].sets[b.dataset.j];
    // si marcan sin escribir, usar los valores sugeridos (placeholder)
    if(!s.done){
      const row=b.parentElement; const w=row.querySelector('[data-f="w"]'), r=row.querySelector('[data-f="r"]');
      if(!s.r && r.placeholder && /^\d/.test(r.placeholder)){ s.r=r.placeholder; r.value=s.r; }
      if(!s.w && w.placeholder && /^\d/.test(w.placeholder)){ s.w=w.placeholder; w.value=s.w; }
      if(!num(s.r)){ toast('Escribe tus repeticiones'); return; }
    }
    s.done=!s.done; b.classList.toggle('on',s.done); save();
  });
  $('#cancel').onclick=()=>confirmBox('¿Descartar este entrenamiento?','Sí, descartar',()=>{ S.draft=null; save(); render(); });
  $('#finish').onclick=()=>{
    const sets=[];
    d.ex.forEach(x=>x.sets.forEach(s=>{ if(num(s.r)>0 && (s.done || s.w!=='' )) sets.push({ex:x.id,w:num(s.w),r:num(s.r)}); }));
    if(!sets.length){ toast('Registra al menos una serie'); return; }
    const info={rk:d.rk,day:d.day,dayName:d.dayName,sets};
    S.draft=null;
    finishSession(info);
  };
}

/* ===================== GUARDAR SESIÓN ===================== */
function finishSession(info){
  const before=metrics(); const bIdx=stageIdx(before);
  S.sessions.push({id:Date.now(),date:new Date().toISOString(),...info});
  save();
  const after=metrics(); const aIdx=stageIdx(after);
  const prs=KEY_LIFTS.filter(k=>after.best[k]>before.best[k]+0.01 && before.best[k]>0);
  const firsts=KEY_LIFTS.filter(k=>after.best[k]>0 && before.best[k]===0);
  ui.day=null; ui.rk=null;
  if(aIdx>bIdx){
    const st=STAGES[aIdx];
    openModal(`<div class="center"><div style="font-size:80px">${st.i}</div><div class="eyebrow">¡Subiste de etapa!</div>
      <h1 style="margin:6px 0">Ahora eres ${st.n}</h1><p class="muted" style="margin-bottom:18px">${st.d}</p>
      <button class="btn gold" id="mOk">¡Vamos!</button></div>`);
    $('#mOk').onclick=()=>{ closeModal(); go('inicio'); };
  } else if(info.sets.length){
    const vol=info.sets.reduce((a,s)=>a+s.w*s.r,0);
    openModal(`<div class="center"><div style="font-size:60px">🦍</div><h1 style="margin:6px 0">¡Entrenamiento guardado!</h1>
      <p class="muted">${info.sets.length} series · ${Math.round(vol).toLocaleString('es-MX')} kg movidos</p>
      ${prs.length?`<p style="margin-top:12px;color:var(--gold);font-weight:700">🏆 Nuevo récord en ${prs.map(k=>EX[k].n.replace(' con barra','')).join(', ')}</p>`:''}
      ${firsts.length&&!prs.length?`<p style="margin-top:12px;color:var(--leaf)">Primer registro de ${firsts.map(k=>EX[k].n.replace(' con barra','')).join(', ')}. ¡A superarlo!</p>`:''}
      <div style="height:16px"></div><button class="btn" id="mOk">Listo</button></div>`);
    $('#mOk').onclick=()=>{ closeModal(); go('inicio'); };
  } else { toast('¡Visita registrada! 🌿'); }
  render();
}

/* ===================== PROGRESO ===================== */
function liftSeries(k){
  return S.sessions.map(s=>{ let v=0; (s.sets||[]).forEach(st=>{ if(st.ex===k){ const e=e1rm(st.w,st.r); if(e>v) v=e; } }); return {d:s.date,v}; }).filter(p=>p.v>0);
}
function lineChart(pts){
  if(pts.length<2) return `<p class="small muted" style="margin-top:8px">Registra este ejercicio en 2 sesiones o más para ver tu gráfica.</p>`;
  const W=320,H=90,P=8; const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi-lo<1){hi+=1;lo-=1;}
  const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), H-P-(p.v-lo)/(hi-lo)*(H-2*P)]);
  const line=xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const area=`${P},${H-P} ${line} ${W-P},${H-P}`;
  const l=xy[xy.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polygon points="${area}" fill="rgba(255,178,46,.16)"/><polyline points="${line}" fill="none" stroke="#ffb22e" style="filter:drop-shadow(0 0 6px rgba(255,170,40,.7))" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="4" fill="#ffd27a"/></svg>`;
}
function weekBars(){
  const W=320,H=90; const weeks=[]; let w=weekStart(new Date());
  for(let i=7;i>=0;i--){ const x=new Date(w); x.setDate(x.getDate()-7*i); weeks.push(x); }
  const counts=weeks.map(ws=>{ const a=ws.getTime(), b=a+7*86400000; return new Set(S.sessions.filter(s=>{const t=new Date(s.date).getTime();return t>=a&&t<b;}).map(s=>ymd(new Date(s.date)))).size; });
  const max=Math.max(S.profile.days,...counts,1); const bw=(W-7*8)/8;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}">
    <line x1="0" x2="${W}" y1="${(H-S.profile.days/max*H).toFixed(1)}" y2="${(H-S.profile.days/max*H).toFixed(1)}" stroke="#ffd27a" stroke-dasharray="4 4" stroke-width="1"/>
    ${counts.map((c,i)=>{ const h=c/max*H; const x=i*(bw+8);
      return `<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="4" fill="${c>=S.profile.days?'#ffb22e':'#2b4a8f'}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="10" fill="#9eaed0">${weeks[i].getDate()}/${weeks[i].getMonth()+1}</text>`; }).join('')}
  </svg><p class="small muted">Días entrenados por semana. La línea dorada es tu meta (${S.profile.days} días).</p>`;
}
function renderProgreso(view,m){
  const hist=S.sessions.slice().reverse().slice(0,25);
  view.innerHTML=`
    <h1 style="margin-bottom:4px">Tu progreso</h1>
    <p class="muted small" style="margin-bottom:12px">Fuerza estimada a 1 repetición máxima, calculada con tus series.</p>
    ${KEY_LIFTS.map(k=>{ const s=liftSeries(k); const best=m.best[k];
      return `<div class="card"><div class="lift"><span style="font-weight:700">${esc(EX[k].n)}</span><b>${best?Math.round(best)+' kg':'—'}</b></div>
        ${best&&num(S.profile.weight)?`<div class="small muted">${(best/num(S.profile.weight)).toFixed(2)}× tu peso corporal</div>`:''}
        ${lineChart(s)}</div>`; }).join('')}
    <div class="card"><div class="lift"><span style="font-weight:700">Fuerza total</span><b>${m.ratio?m.ratio.toFixed(2)+'×':'—'}</b></div>
      <div class="small muted">(Sentadilla + banca + peso muerto) ÷ tu peso. Es el número que cuenta para subir de etapa.</div></div>
    <h2>Constancia</h2><div class="card">${weekBars()}</div>
    <h2>Historial</h2>
    <div class="card">${hist.length?hist.map(s=>{
      const vol=(s.sets||[]).reduce((a,x)=>a+x.w*x.r,0);
      return `<div class="hist"><div><div style="font-weight:700">${esc(s.dayName||'Entrenamiento')}</div>
        <div class="small muted">${fmtDate(s.date)}${s.sets&&s.sets.length?` · ${s.sets.length} series · ${Math.round(vol).toLocaleString('es-MX')} kg`:''}</div></div>
        <button class="x" data-id="${s.id}" aria-label="Borrar">✕</button></div>`; }).join('')
      :'<div class="empty">Aún no hay entrenamientos. ¡El primero es el más importante! 🌱</div>'}</div>`;
  view.querySelectorAll('.x').forEach(b=>b.onclick=()=>confirmBox('¿Borrar este registro?','Borrar',()=>{
    S.sessions=S.sessions.filter(s=>String(s.id)!==b.dataset.id); save(); render();
  }));
}

/* ===================== ETAPAS ===================== */
function renderEtapas(view,m){
  const idx=stageIdx(m), f=strengthFactor(), li=levelIdx(m.months), g=ageGroup();
  view.innerHTML=`
    <h1 style="margin-bottom:4px">Niveles de rutina</h1>
    <p class="muted small" style="margin-bottom:14px">Tu rutina depende de cuánto tiempo llevas entrenando en Kong Gym y se ajusta a tu edad.</p>
    <div class="stage-list">${LEVELS.map((L,j)=>{ const r=getRoutine(rkForLevel(L.k)); const to=LEVELS[j+1];
      return `<div class="card ${j===li?'cur':''} ${j>li?'lock':''}">
        <div class="si">${L.i}</div>
        <div style="flex:1"><div class="eyebrow">${j===li?'Tu nivel':j<li?'Superado ✓':(to?L.from+'–'+to.from+' meses':'+'+L.from+' meses')}</div>
          <h3>${L.n}</h3><p class="small muted">${L.d}</p>
          <div class="req"><span>⏳ ${to?L.from+' a '+to.from+' meses':'Más de '+L.from+' meses'}</span><span>📅 ${r.freq} días</span></div>
          <p class="small" style="margin-top:8px">Rutina: <b>${esc(r.n)}</b></p></div></div>`; }).join('')}</div>
    <div class="card small"><div class="eyebrow">Ajuste por edad${S.profile.birth?' · '+AGE[g].n:''}</div>
      <p style="margin-top:6px">${esc(AGE[g].note)}</p>
      <ul class="muted" style="margin:10px 0 0 18px">
        <li><b>14–17:</b> mínimo 8 reps y máximo 3 series.</li>
        <li><b>18–39:</b> rutina completa.</li>
        <li><b>40–54:</b> mínimo 6 reps y más calentamiento.</li>
        <li><b>55+:</b> 8–12 reps, máximo 3 series, ejercicios más seguros (por ejemplo, jalón en vez de dominadas), y equilibrio al final.</li>
      </ul></div>

    <h1 style="margin:26px 0 4px">Las etapas de la jungla</h1>
    <p class="muted small" style="margin-bottom:14px">Tu rango en Kong Gym. Subes cuando cumples tres cosas: tiempo en el gym, días entrenados y fuerza.</p>
    <div class="stage-list">${STAGES.map((st,j)=>`
      <div class="card ${j===idx?'cur':''} ${j>idx?'lock':''}">
        <div class="si">${st.i}</div>
        <div style="flex:1"><div class="eyebrow">${j===idx?'Tu etapa':j<idx?'Superada ✓':'Etapa '+(j+1)}</div>
          <h3>${st.n}</h3><p class="small muted">${st.d}</p>
          ${j>0?`<div class="req">
            <span class="${m.months>=st.m?'ok':''}">⏳ ${st.m} ${st.m===1?'mes':'meses'}</span>
            <span class="${m.days>=st.s?'ok':''}">📅 ${st.s} días</span>
            <span class="${m.ratio>=st.f*f?'ok':''}">💪 ${(st.f*f).toFixed(1)}× tu peso</span></div>`:''}
        </div></div>`).join('')}</div>
    <div class="note">💪 <b>Fuerza</b> = tu mejor sentadilla + press de banca + peso muerto (estimados a 1 repetición) dividido entre tu peso corporal. Las metas se ajustan a tu sexo y edad.</div>`;
}
/* ===================== PERFIL ===================== */
function renderPerfil(view){
  view.innerHTML=`
    <h1 style="margin-bottom:12px">Tu perfil</h1>
    <div class="card">${profileFields(S.profile)}<button class="btn" id="pSave">Guardar cambios</button></div>
    <h2>Respaldo</h2>
    <div class="card"><p class="small muted" style="margin-bottom:10px">Tus datos viven en este teléfono. Copia tu respaldo y guárdalo (por ejemplo, mándatelo por WhatsApp) para no perderlos si cambias de celular.</p>
      <button class="btn ghost" id="bkCopy">Copiar mi respaldo</button>
      <textarea id="bkIn" rows="3" placeholder="Pega aquí un respaldo para restaurarlo" style="margin-top:10px"></textarea>
      <button class="btn ghost" id="bkLoad" style="margin-top:10px">Restaurar respaldo</button></div>
    <button class="btn danger" id="reset" style="margin-top:8px">Borrar todos mis datos</button>
    <div class="logo-hero" style="max-width:220px;margin-top:20px"><img src="${LOGO_FULL}" alt="Kong Gym"></div><p class="small muted center">Kong Gym · Mompani, Querétaro</p>`;
  bindSex();
  $('#pSave').onclick=()=>{ const p=readProfile(); if(!validProfile(p)) return; S.profile=p; save(); toast('Perfil actualizado'); render(); };
  $('#bkCopy').onclick=async()=>{
    const code='KONG1:'+btoa(unescape(encodeURIComponent(JSON.stringify({profile:S.profile,sessions:S.sessions,custom:S.custom||null,useCustom:!!S.useCustom,exNames:S.exNames||{}}))));
    try{ await navigator.clipboard.writeText(code); toast('Respaldo copiado'); }
    catch(e){ $('#bkIn').value=code; $('#bkIn').select(); toast('Cópialo del cuadro de abajo'); }
  };
  $('#bkLoad').onclick=()=>{
    try{
      const raw=$('#bkIn').value.trim().replace(/^KONG1:/,'');
      const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!data.profile||!Array.isArray(data.sessions)) throw 0;
      confirmBox('¿Reemplazar tus datos actuales con este respaldo?','Restaurar',()=>{ S={profile:data.profile,sessions:data.sessions,draft:null,custom:data.custom||null,useCustom:!!data.useCustom,exNames:data.exNames||{},seenLevel:null}; save(); toast('Respaldo restaurado'); render(); });
    }catch(e){ toast('Ese respaldo no es válido'); }
  };
  $('#reset').onclick=()=>confirmBox('¿Borrar todo tu progreso? No se puede deshacer.','Borrar todo',()=>{ S={profile:null,sessions:[],draft:null}; save(); location.hash=''; render(); });
}

  window.addEventListener('load',()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
}
render();
